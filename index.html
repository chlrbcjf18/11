<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="아침 미션">
<meta name="theme-color" content="#e3350d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>아침 미션 대시보드</title>
<style>
:root{
  --red:#e3350d; --red-d:#b3260a; --yellow:#ffcb05; --blue:#2a75bb; --navy:#1d2c5e;
  --bg:#fff8e1; --card:#ffffff; --ink:#22264a; --mute:#6b7190; --line:#e6e2d3; --ok:#2e9e5b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color:var(--ink);background:var(--bg);
  background-image:radial-gradient(circle at 20px 20px,rgba(255,203,5,.25) 3px,transparent 4px);
  background-size:40px 40px;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#stage{position:fixed;top:env(safe-area-inset-top);right:env(safe-area-inset-right);bottom:env(safe-area-inset-bottom);left:env(safe-area-inset-left);overflow:hidden}
.app{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;flex-direction:column;gap:12px;padding:14px}

/* 상단 */
.top{display:grid;grid-template-columns:1fr 1.2fr 1.35fr;gap:12px;align-items:stretch}
.top>.panel{container-type:inline-size;min-width:0}
.panel{background:var(--card);border-radius:22px;border:3px solid var(--navy);box-shadow:0 5px 0 var(--navy);padding:12px 18px}
.clock{display:flex;flex-direction:column;justify-content:center;background:var(--red);color:#fff;position:relative;overflow:hidden}
.clock:after{content:"";position:absolute;right:-11cqw;bottom:-34px;width:38cqw;height:38cqw;border-radius:50%;
  background:radial-gradient(circle,#fff 0 18%,var(--navy) 19% 27%,transparent 28%),linear-gradient(#ffffff33 0 46%,var(--navy) 46% 54%,#ffffff22 54%);opacity:.5}
.clock .time{font-size:max(58px,27cqw);position:relative;z-index:1;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.clock .date{font-size:max(19px,8.5cqw);position:relative;z-index:1;font-weight:700;margin-top:6px;opacity:.95}
.count{display:flex;flex-direction:column;justify-content:center;gap:1.6cqw}
.count .label{font-size:max(19px,5cqw);font-weight:800;color:var(--mute)}
.count .big{font-size:max(40px,13cqw);font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
.count.warn .big{color:#e08a00}.count.hurry .big{color:var(--red);animation:pulse 1s infinite}
.bar{height:16px;border-radius:10px;background:#eee7cf;overflow:hidden;border:2px solid var(--navy)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),#ff9d00);transition:width .5s}
.count.hurry .bar i{background:var(--red)}
.weather{display:flex;flex-direction:column;justify-content:center;gap:.6cqw}
.weather .row{display:flex;align-items:center;gap:3cqw}
.weather .ico{font-size:max(50px,16cqw);line-height:1}
.weather .temp{font-size:max(38px,13cqw);font-weight:900;line-height:1}
.weather .sub{font-size:max(15px,4.4cqw);color:var(--mute);font-weight:700}
.weather .tip{font-size:max(16px,4.8cqw);font-weight:800;color:var(--blue)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:max(13px,3.9cqw);font-weight:800;padding:3px 9px;border-radius:99px;background:#eef3ff;color:var(--navy)}
.chip.g1{background:#dff5e6;color:#17693a}.chip.g2{background:#e4efff;color:#1d4f9c}.chip.g3{background:#ffe9c7;color:#9a5a00}.chip.g4{background:#ffd9d2;color:#a11b05}

/* 확언 */
.affirm{display:flex;align-items:center;gap:12px;background:var(--yellow);padding:12px 18px}
.affirm .tag{flex:none;background:var(--navy);color:#fff;font-weight:900;font-size:15px;padding:5px 12px;border-radius:99px}
.affirm .txt{font-size:27px;font-weight:900;line-height:1.25;flex:1}
.iconbtn{flex:none;width:52px;height:52px;border-radius:50%;background:#fff;border:3px solid var(--navy);font-size:24px;display:grid;place-items:center}
.iconbtn:active{transform:translateY(2px)}

/* 아이 카드 */
.kids{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1}
.kid{display:flex;flex-direction:column;gap:10px;padding:14px}
.kid.done{border-color:var(--ok);box-shadow:0 5px 0 var(--ok);background:#f3fff6}
.khead{display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap}
.kname{font-size:30px;font-weight:900;flex:1 0 auto;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kleft{font-size:16px;font-weight:800;color:var(--mute);text-align:right;white-space:nowrap}
.kprog{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px}
.kprog .bar{flex:1}.kprog .bar i{background:linear-gradient(90deg,#7ed957,var(--ok))}
.sect{font-size:15px;font-weight:900;color:var(--mute);margin-top:2px}
.items{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:8px}
.items.main{flex:1 1 auto}
.item{display:flex;align-items:center;gap:10px;min-height:66px;padding:8px 12px;border-radius:16px;background:#fff;border:3px solid var(--line);text-align:left;font-size:21px;font-weight:800;transition:transform .08s}
.item:active{transform:scale(.97)}
.item .em{font-size:30px;flex:none}
.item .lb{flex:1;line-height:1.15;word-break:keep-all;overflow-wrap:anywhere}
.item .ck{flex:none;width:34px;height:34px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-size:20px;color:transparent}
.item.on{background:#e9f9ee;border-color:var(--ok);color:#3d6b4d}
.item.on .lb{text-decoration:line-through;text-decoration-thickness:2px}
.item.on .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.item.sup{border-style:dashed;border-color:#f0b400;background:#fffbe6}
.item.sup.on{border-style:solid;border-color:var(--ok);background:#e9f9ee}
.week{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:6px}
.slot{flex:1;min-width:0;aspect-ratio:1;max-width:74px;border-radius:50%;border:3px dashed #cfc8ae;display:grid;place-items:center;font-size:13px;font-weight:900;color:#b9b196;position:relative;background:#fffdf3}
.slot.today{border-color:var(--red);color:var(--red)}
.slot.got{border:0;background:none}
.boardbtn{flex:none;padding:10px 14px;border-radius:14px;background:var(--navy);color:#fff;font-weight:900;font-size:15px}

/* 도장(스티커) */
.stk{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;border:3px solid var(--navy);overflow:hidden;
  background:linear-gradient(var(--c,#ffcb05) 0 50%,#fff 50%);box-shadow:inset 0 -4px 0 #0001;font-size:calc(var(--s,60px)*.5);line-height:1}
.stk img{width:100%;height:100%;object-fit:cover}
.stamp{animation:stamp .5s cubic-bezier(.2,2,.4,1)}
@keyframes stamp{0%{transform:scale(3) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes pulse{50%{opacity:.55}}

/* 모달 */
.modal{position:fixed;inset:0;background:rgba(20,24,50,.6);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
.modal.show{display:flex}
.sheet{background:#fff;border-radius:24px;border:3px solid var(--navy);width:min(760px,100%);max-height:100%;overflow:auto;padding:20px;-webkit-overflow-scrolling:touch}
.sheet h2{margin:0 0 12px;font-size:26px;display:flex;align-items:center;gap:10px}
.sheet h2 span{flex:1}
.sheet h3{margin:18px 0 8px;font-size:18px;color:var(--blue)}
.f{display:grid;grid-template-columns:130px 1fr;gap:8px 10px;align-items:center;font-weight:700}
.f.two{grid-template-columns:130px 1fr 150px}
input[type=text],input[type=time],input[type=number],textarea{font:inherit;font-size:18px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;width:100%;-webkit-user-select:text;user-select:text;background:#fff;color:var(--ink)}
textarea{min-height:170px;resize:vertical}
.hint{font-size:14px;color:var(--mute);font-weight:600;margin:6px 0 0;line-height:1.5}
.switch{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#f4f6ff;font-weight:800;font-size:19px}
.switch input{width:30px;height:30px;accent-color:var(--red)}
.btn{padding:14px 20px;border-radius:14px;background:var(--red);color:#fff;font-weight:900;font-size:18px}
.btn.gray{background:#e9e9f1;color:var(--ink)}
.btn.line{background:#fff;border:2px solid var(--line);color:var(--ink);font-size:15px;padding:10px 14px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .dow{font-size:13px;font-weight:900;color:var(--mute)}
.cal .d{aspect-ratio:1;border-radius:14px;background:#f6f4ea;font-size:13px;font-weight:800;color:#a39c84;display:grid;place-items:center;position:relative;padding:3px}
.cal .d.t{outline:3px solid var(--red)}
.cal .d .n{position:absolute;left:5px;top:3px;font-size:11px}
.cal .d .stk{width:78%;height:78%}
.custom{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.custom .c{width:64px;height:64px;position:relative}
.custom .c button{position:absolute;right:-6px;top:-6px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:900}

/* 축하 */
.cele{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(29,44,94,.82);z-index:20;color:#fff;text-align:center}
.cele.show{display:flex}
.cele .bigstk{width:200px;height:200px;--s:200px}
.cele h1{font-size:40px;margin:0}.cele p{font-size:22px;margin:0;font-weight:700}
.conf{position:fixed;top:-20px;font-size:28px;animation:fall linear forwards;z-index:21;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* 화면 비율별 배치 (JS가 가장 크게 보이는 배치를 고름) */
.mB .top,.mC .top{grid-template-columns:1fr 1fr}
.mB .count,.mC .count{grid-column:1/-1;order:3;flex-direction:row;align-items:center;flex-wrap:wrap;gap:6px 14px}
.mB .count .bar,.mC .count .bar{flex:1 1 100%}
.mB .count .big,.mC .count .big{font-size:max(40px,7cqw)}
.mB .count .label,.mC .count .label{font-size:max(19px,2.8cqw)}
.mB .items{grid-template-columns:1fr}
.mC .kids{grid-template-columns:1fr}
.mB .affirm .txt,.mC .affirm .txt{font-size:23px}
@media (max-width:560px){.f,.f.two{grid-template-columns:1fr}.sheet{padding:14px}}
</style>
</head>
<body>
<div id="stage"><div class="app" id="app">
  <div class="top">
    <div class="panel clock"><div class="time" id="time">--:--</div><div class="date" id="date"></div></div>
    <div class="panel count" id="count">
      <div class="label" id="cLabel"></div>
      <div class="big" id="cBig"></div>
      <div class="bar"><i id="cBar"></i></div>
    </div>
    <div class="panel weather" id="weather"></div>
  </div>

  <div class="panel affirm">
    <div class="tag">오늘의 한마디</div>
    <div class="txt" id="affirm"></div>
    <button class="iconbtn" id="musicBtn" aria-label="노래 켜기/끄기">🎵</button>
    <button class="iconbtn" id="wakeBtn" aria-label="화면 꺼짐 방지 상태">💡</button>
    <button class="iconbtn" id="setBtn" aria-label="설정">⚙️</button>
  </div>

  <div class="kids" id="kids"></div>
</div></div>

<div class="modal" id="boardModal"><div class="sheet" id="boardSheet"></div></div>
<div class="modal" id="setModal"><div class="sheet" id="setSheet"></div></div>
<div class="cele" id="cele"></div>

<script>
'use strict';
const KEY='morningMission.v1';
const DOW=['일','월','화','수','목','금','토'];
const DEFAULT={
  cfg:{
    kids:[{name:'첫째',depart:'08:20'},{name:'둘째',depart:'08:20'}],
    start:'07:30',
    routine:['🚽 화장실 다녀오기','🧼 세수하고 로션 바르기','🍚 아침밥 먹기','🪥 양치하기','👕 옷 갈아입기','🎒 가방 챙기기','👟 양말·신발 신기'],
    supplies:{0:'',1:'태권도가방',2:'태권도가방',3:'',4:'',5:'태권도가방',6:''},
    wake:true,sound:true,autoMusic:true,vol:0.6,
    loc:{name:'안양시 동안구 비산동',lat:37.3975,lon:126.9450},
    custom:[]
  },
  days:{}
};
// 기본 도장: 타입 배지(이모지 + 색). 공식 캐릭터 그림은 포함하지 않음 → 설정에서 직접 추가 가능
const STICKERS=[['⚡','#ffcb05'],['🔥','#ff6b3d'],['💧','#4aa8ff'],['🌿','#5fc45a'],['❄️','#9be3f5'],['🌙','#7a6ad8'],['⭐','#ffb300'],
  ['🐉','#5b7be0'],['🦊','#ff8a3d'],['🐢','#49b6c9'],['🦋','#b57be8'],['🐭','#ffd84a'],['🦉','#b08a5a'],['🐸','#58c98b'],
  ['🐧','#5aa0e6'],['🦖','#6cbf4a'],['🐱','#f5a3c0'],['🌈','#ff7aa8'],['👑','#f2b800'],['🥚','#e9e2c8']];
const AFFIRM=[
 '나는 오늘도 씩씩하게 시작할 수 있어!','나는 무엇이든 끝까지 해내는 멋진 트레이너야.','오늘은 어제보다 한 뼘 더 자랐어.',
 '틀려도 괜찮아, 다시 하면 돼!','나는 사랑받는 소중한 사람이야.','내 미소는 친구들을 기분 좋게 해.','나는 스스로 준비할 수 있어.',
 '오늘도 새로운 걸 배울 거야, 신난다!','나는 용감해. 처음 해 보는 것도 도전할 수 있어.','천천히 해도 괜찮아, 나는 해낼 거야.',
 '나는 친구에게 먼저 인사하는 다정한 사람이야.','내 생각은 소중해. 또박또박 말할 수 있어.','오늘 하루도 즐거운 모험이 될 거야!',
 '나는 약속을 잘 지키는 믿음직한 사람이야.','힘들 땐 도와달라고 말할 수 있어.','나는 매일매일 레벨 업 하고 있어!',
 '내 몸은 튼튼하고, 내 마음은 따뜻해.','나는 집중하면 뭐든 잘할 수 있어.','실수는 내가 자라고 있다는 증거야.',
 '나는 우리 가족의 자랑이야.','오늘도 고마운 일을 하나 찾아볼 거야.','나는 친구의 이야기를 잘 들어주는 사람이야.',
 '나는 할 수 있다! 할 수 있다! 할 수 있다!','오늘의 나는 반짝반짝 빛나.','어려운 일도 한 걸음씩 하면 돼.',
 '나는 내 물건을 스스로 챙길 수 있어.','웃으면서 시작하면 좋은 일이 생겨.','나는 나를 믿어!',
 '오늘도 안전하게, 신나게 다녀올게!','나는 양보할 줄 아는 멋진 사람이야.','지금 이대로의 나도 충분히 멋져.'
];

/* ---------- 저장 ---------- */
let S=load();
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY));
    if(s&&s.cfg){s.cfg=Object.assign({},DEFAULT.cfg,s.cfg);s.days=s.days||{};return s}
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT));
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- 유틸 ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hm=s=>{const[a,b]=(s||'0:0').split(':').map(Number);return a*60+b};
function splitItem(line){ // "🧼 세수하기" → {em,lb}
  const m=line.trim().match(/^(\p{Extended_Pictographic}[️‍\p{Extended_Pictographic}]*)\s*(.+)$/u);
  return m?{em:m[1],lb:m[2]}:{em:'✅',lb:line.trim()};
}
function routine(){return S.cfg.routine.map(l=>l.trim()).filter(Boolean)}
function supplies(dow){return (S.cfg.supplies[dow]||'').split(',').map(s=>s.trim()).filter(Boolean)}
function dayRec(key,k){S.days[key]=S.days[key]||{};S.days[key][k]=S.days[key][k]||{c:{}};return S.days[key][k]}
function stickerPool(){return STICKERS.map(([e,c])=>({e,c})).concat(S.cfg.custom.map(img=>({img})))}
function stkHTML(st){
  if(!st)return '';
  return st.img?`<div class="stk"><img src="${st.img}" alt=""></div>`:`<div class="stk" style="--c:${st.c}">${st.e}</div>`;
}

/* ---------- 소리 ---------- */
let AC=null;
function ensureAC(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state!=='running')AC.resume().catch(()=>{});
  }catch(e){}
  return AC;
}
function tone(dest,f,s,d,vol,type){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'triangle';o.frequency.value=f;o.connect(g);g.connect(dest);
  g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(vol,s+.015);
  g.gain.exponentialRampToValueAtTime(.0001,s+d);o.start(s);o.stop(s+d+.03);
}
function beep(notes){
  if(!S.cfg.sound||!ensureAC())return;
  try{notes.forEach(([f,t,d])=>tone(AC.destination,f,AC.currentTime+t,d,.25*S.cfg.vol+.05))}catch(e){}
}

/* ---------- 노래 (직접 만든 경쾌한 8비트 멜로디, 파일·저작권 없음) ---------- */
const STEP=0.2; // 8분음표 길이(초) = 150BPM
const MEL=[76,79,84,79,76,79,84,0, 74,79,83,79,74,79,83,0, 72,76,81,76,72,76,81,79, 77,81,84,81,77,-1,79,81,
           79,-1,76,79,84,-1,83,81, 79,-1,74,79,83,-1,81,79, 81,81,84,81,83,83,86,83, 84,-1,79,76,84,-1,0,0];
const ROOT=[48,48,43,43,45,45,41,41,48,48,43,43,41,43,48,48]; // 반 마디 단위 베이스
const hz=m=>440*Math.pow(2,(m-69)/12);
let music={on:false,timer:null,gain:null,step:0,next:0,auto:false,noise:null},autoStopKey='';
function noiseBuf(){
  if(music.noise)return music.noise;
  const b=AC.createBuffer(1,AC.sampleRate*.05,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  return music.noise=b;
}
function schedule(){
  if(!music.on||AC.state!=='running')return;
  if(music.next<AC.currentTime)music.next=AC.currentTime+.05;
  while(music.next<AC.currentTime+.4){
    const i=music.step%64,t=music.next,g=music.gain,m=MEL[i];
    if(m>0){let len=1;while(MEL[(i+len)%64]===-1&&len<8)len++;tone(g,hz(m),t,STEP*len*.9,.16,'square')}
    const r=ROOT[Math.floor(i/4)],k=i%4;
    tone(g,hz(k===2?r+12:k===3?r+7:r),t,STEP*.85,k===0?.3:.2,'triangle');
    if(k===0){ // 킥
      const o=AC.createOscillator(),kg=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);
      kg.gain.setValueAtTime(.5,t);kg.gain.exponentialRampToValueAtTime(.0001,t+.14);o.connect(kg);kg.connect(g);o.start(t);o.stop(t+.16);
    }
    if(i%2===1||k===2){ // 하이햇·박수
      const n=AC.createBufferSource(),ng=AC.createGain();n.buffer=noiseBuf();ng.gain.value=k===2?.22:.1;n.connect(ng);ng.connect(g);n.start(t);
    }
    music.step++;music.next+=STEP;
  }
}
function startMusic(auto){
  if(music.on||!ensureAC())return;
  music.gain=AC.createGain();music.gain.gain.value=.55*S.cfg.vol;music.gain.connect(AC.destination);
  music.on=true;music.auto=!!auto;music.step=0;music.next=0;
  music.timer=setInterval(schedule,100);schedule();musicUI();
}
function stopMusic(){
  if(!music.on)return;
  clearInterval(music.timer);music.on=false;
  try{const g=music.gain;g.gain.setTargetAtTime(0,AC.currentTime,.05);setTimeout(()=>g.disconnect(),600)}catch(e){}
  musicUI();
}
function musicUI(){const b=$('musicBtn');b.textContent=music.on?'🎶':'🎵';b.style.background=music.on?'#ffd6e8':'#fff'}
$('musicBtn').addEventListener('click',()=>{
  if(music.on){stopMusic();autoStopKey=dkey(new Date())}else startMusic(false);
});
function autoMusic(sec,start,dep,key){ // 미션 시간에 자동 재생 / 출발 시간에 자동 정지
  const inWin=sec>=start&&sec<dep;
  if(inWin&&S.cfg.autoMusic&&!music.on&&autoStopKey!==key&&AC){
    if(AC.state==='running')startMusic(true);else AC.resume().catch(()=>{});
  }
  if(!inWin&&music.on&&music.auto)stopMusic();
}

/* ---------- 시계 / 카운트다운 ---------- */
let curKey='';
function tick(){
  const now=new Date(),key=dkey(now);
  if(key!==curKey){curKey=key;renderAll()}
  $('time').textContent=pad(now.getHours())+':'+pad(now.getMinutes());
  $('date').textContent=`${now.getMonth()+1}월 ${now.getDate()}일 ${DOW[now.getDay()]}요일`;
  const sec=now.getHours()*3600+now.getMinutes()*60+now.getSeconds();
  const start=hm(S.cfg.start)*60, dep=Math.min(...S.cfg.kids.map(k=>hm(k.depart)))*60;
  const box=$('count');box.className='panel count';
  const fmt=s=>{const m=Math.floor(s/60);return m>=60?`${Math.floor(m/60)}시간 ${m%60}분`:`${m}분 ${pad(s%60)}초`};
  if(sec<start){
    $('cLabel').textContent=`⏰ ${S.cfg.start} 미션 시작!`;
    $('cBig').textContent='시작까지 '+fmt(start-sec);$('cBar').style.width='0%';
  }else if(sec<dep){
    const left=dep-sec;
    $('cLabel').textContent='🚪 출발까지 남은 시간';
    $('cBig').textContent=fmt(left);
    $('cBar').style.width=Math.min(100,(sec-start)/(dep-start)*100)+'%';
    if(left<=300)box.classList.add('hurry');else if(left<=600)box.classList.add('warn');
  }else{
    $('cLabel').textContent='🚪 출발 시간이 지났어요';
    $('cBig').textContent='잘 다녀와! 👋';$('cBar').style.width='100%';
  }
  S.cfg.kids.forEach((k,i)=>{
    const el=$('kleft'+i);if(!el)return;
    const l=hm(k.depart)*60-sec;
    el.textContent=l>0?`${k.depart} 출발 · ${Math.ceil(l/60)}분 남음`:`${k.depart} 출발`;
  });
  autoMusic(sec,start,dep,key);
}

function tasksFor(){

function isDone(rec,t){return t.r.every(x=>rec.c['r:'+x])&&t.s.every(x=>rec.c['s:'+x])&&(t.r.length+t.s.length>0)}

$('kids').addEventListener('click',e=>{

/* ---------- 화면 꺼짐 방지 ---------- */
let wl=null;const WL_OK='wakeLock' in navigator;
async function acquireWake(){
  if(!S.cfg.wake||!WL_OK||wl||document.visibilityState!=='visible'){wakeUI();return}
  try{wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null;wakeUI()})}catch(e){wl=null}
  wakeUI();
}
function releaseWake(){if(wl){wl.release().catch(()=>{});wl=null}wakeUI()}
function wakeUI(){
  const b=$('wakeBtn');
  b.textContent=wl?'💡':'🌙';b.style.background=wl?'#fff3a6':'#fff';
  b.title=wl?'화면 꺼짐 방지 켜짐':'화면 꺼짐 방지 꺼짐';
  const s=$('wakeState');if(s)s.textContent=wakeText();
}
function wakeText(){
  if(!WL_OK)return '이 기기/브라우저는 화면 꺼짐 방지를 지원하지 않아요. 아이패드 설정 > 디스플레이 및 밝기 > 자동 잠금 > "안 함"으로 바꿔 주세요.';
  if(!S.cfg.wake)return '꺼져 있어요. 아이패드의 자동 잠금 시간에 따라 화면이 꺼집니다.';
  return wl?'✅ 작동 중 — 이 화면이 보이는 동안 꺼지지 않아요.':'대기 중 — 화면을 한 번 터치하면 다시 켜집니다.';
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){acquireWake();loadWeather()}});

/* ---------- 날씨 (Open-Meteo, 키 불필요) ---------- */
const WMO=c=>c===0?['☀️','맑음']:c<=2?['🌤️','구름 조금']:c===3?['☁️','흐림']:c<=48?['🌫️','안개']:c<=57?['🌦️','이슬비']:c<=67?['🌧️','비']:c<=77?['❄️','눈']:c<=82?['🌧️','소나기']:c<=86?['🌨️','눈']:['⛈️','천둥번개'];
function grade(v,a){return v<=a[0]?[1,'좋음']:v<=a[1]?[2,'보통']:v<=a[2]?[3,'나쁨']:[4,'매우나쁨']}
function wearTip(t){return t>=28?'반팔·반바지, 물통 챙기기':t>=23?'반팔에 얇은 바지':t>=17?'긴팔 티셔츠나 얇은 겉옷':t>=12?'가디건·맨투맨':t>=6?'도톰한 점퍼':t>=0?'패딩이나 두꺼운 외투':'패딩 + 목도리·장갑'}
let W=null;try{W=JSON.parse(localStorage.getItem(KEY+'.w'))}catch(e){}
function renderWeather(){
  const el=$('weather'),name=esc(S.cfg.loc.name);
  if(!W){el.innerHTML=`<div class="sub">📍 ${name}</div><div class="tip">날씨를 불러오는 중…</div>`;return}
  const[ico,txt]=WMO(W.code),rainy=W.pop>=50||(W.code>=51&&W.code<=67)||(W.code>=80&&W.code<=82)||W.code>=95,snowy=(W.code>=71&&W.code<=77)||W.code===85||W.code===86;
  let chips=`<span class="chip">☔ 강수확률 ${W.pop}%</span>`;
  if(W.pm10!=null){const g=grade(W.pm10,[30,80,150]);chips+=`<span class="chip g${g[0]}">미세 ${g[1]}</span>`}
  if(W.pm25!=null){const g=grade(W.pm25,[15,35,75]);chips+=`<span class="chip g${g[0]}">초미세 ${g[1]}</span>`}
  const bad=(W.pm10!=null&&W.pm10>80)||(W.pm25!=null&&W.pm25>35);
  const tip=(snowy?'🧤 눈 와요! 장갑·부츠 · ':rainy?'☂️ 우산 챙기기 · ':'')+(bad?'😷 마스크 · ':'')+'👕 '+wearTip(W.feel);
  const old=Date.now()-W.at>2*3600e3;
  el.innerHTML=`<div class="sub">📍 ${name}${old?' · 이전 정보':''}</div>
    <div class="row"><div class="ico">${ico}</div><div><div class="temp">${Math.round(W.t)}°</div><div class="sub">${txt} · 최저 ${Math.round(W.min)}° / 최고 ${Math.round(W.max)}°</div></div></div>
    <div class="chips">${chips}</div><div class="tip">${tip}</div>`;
  fit();
}
let wBusy=false;
async function loadWeather(force){
  if(wBusy||(!force&&W&&Date.now()-W.at<20*60e3))return;
  wBusy=true;
  const{lat,lon}=S.cfg.loc,q=`latitude=${lat}&longitude=${lon}&timezone=Asia%2FSeoul`;
  try{
    const f=await fetch(`https://api.open-meteo.com/v1/forecast?${q}&current=temperature_2m,apparent_temperature,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=1`).then(r=>r.json());
    const n={at:Date.now(),t:f.current.temperature_2m,feel:f.current.apparent_temperature,code:f.current.weather_code,
      max:f.daily.temperature_2m_max[0],min:f.daily.temperature_2m_min[0],pop:f.daily.precipitation_probability_max[0]||0,pm10:null,pm25:null};
    try{
      const a=await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?${q}&current=pm10,pm2_5`).then(r=>r.json());
      n.pm10=a.current.pm10;n.pm25=a.current.pm2_5;
    }catch(e){}
    W=n;try{localStorage.setItem(KEY+'.w',JSON.stringify(W))}catch(e){}
  }catch(e){
    if(!W)$('weather').innerHTML=`<div class="sub">📍 ${esc(S.cfg.loc.name)}</div><div class="tip">날씨를 불러오지 못했어요 (인터넷 확인)</div>`;
    wBusy=false;return;
  }
  wBusy=false;renderWeather();
}

    c.kids.forEach((k,i)=>{k.name=$('sName'+i).value.trim()||k.name;k.depart=$('sDep'+i).value||k.depart});
    c.start=$('sStart').value||c.start;
    c.sound=$('sSound').checked;c.autoMusic=$('sAuto').checked;c.vol=parseFloat($('sVol').value)||.6;
    if(music.gain)music.gain.gain.value=.55*c.vol;if(c.autoMusic)autoStopKey='';
    const r=$('sRoutine').value.split('\n').map(s=>s.trim()).filter(Boolean);if(r.length)c.routine=r;
    for(let d=0;d<7;d++)c.supplies[d]=$('sSup'+d).value.trim();
    const lat=parseFloat($('sLat').value),lon=parseFloat($('sLon').value);
    const moved=lat!==c.loc.lat||lon!==c.loc.lon;
    c.loc.name=$('sLoc').value.trim()||c.loc.name;if(isFinite(lat)&&isFinite(lon)){c.loc.lat=lat;c.loc.lon=lon}
    c.custom=custom;
    // 설정 변경 후 완료 상태 재계산
    const key=dkey(new Date()),t=tasksFor();
    c.kids.forEach((k,i)=>{const rec=dayRec(key,i);if(!isDone(rec,t))delete rec.st});
    save();$('setModal').classList.remove('show');renderAll();renderWeather();if(moved)loadWeather(true);
  };
  $('setModal').classList.add('show');
}
function shrink(file){ // 도장용 160px 정사각 JPEG로 축소
  return new Promise((ok,no)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const n=160,cv=document.createElement('canvas');cv.width=cv.height=n;
      const s=Math.min(img.width,img.height),x=cv.getContext('2d');
      x.fillStyle='#fff';x.fillRect(0,0,n,n);
      x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,n,n);
      URL.revokeObjectURL(url);ok(cv.toDataURL('image/jpeg',.8));
    };
    img.onerror=no;img.src=url;
  });
}
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('show')}));

/* ---------- 화면에 딱 맞추기 ----------
   배치 3종(A 가로형 / B 정사각형 / C 세로형) 각각에 대해 화면 비율에 꼭 맞는 설계 폭을 찾고,
   글자가 가장 크게 나오는 배치를 골라 전체를 확대·축소한다. 스크롤 없음. */
const MODES=[['mA',1100],['mB',640],['mC',520]];
function fit(){
  const st=$('stage'),app=$('app'),vw=st.clientWidth,vh=st.clientHeight;
  if(!vw||!vh)return;
  app.style.transform='none';app.style.height='auto';
  let best=null;
  for(const[cls,minW]of MODES){
    app.className='app '+cls;
    const fits=W=>{app.style.width=W+'px';return app.offsetHeight*vw/W<=vh};
    let lo=minW,hi=4000;
    if(!fits(hi))continue;
    if(fits(lo))hi=lo;else for(let i=0;i<11;i++){const mid=(lo+hi)/2;fits(mid)?hi=mid:lo=mid}
    hi=Math.ceil(hi);
    if(!best||hi<best.W)best={cls,W:hi};
  }
  if(!best)best={cls:'mC',W:4000};
  const sc=vw/best.W;
  app.className='app '+best.cls;app.style.width=best.W+'px';app.style.height=(vh/sc)+'px';app.style.transform=`scale(${sc})`;
}
let fitT=0;const refit=()=>{clearTimeout(fitT);fitT=setTimeout(fit,60)};
addEventListener('resize',refit);addEventListener('orientationchange',refit);
if(window.visualViewport)visualViewport.addEventListener('resize',refit);

tick();setInterval(tick,1000);
renderWeather();loadWeather();setInterval(()=>loadWeather(),10*60e3);
acquireWake();fit();
